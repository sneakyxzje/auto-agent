map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream api     { server api:3001; }
upstream console { server console:3000; }

server {
  listen 80;
  server_name _;

  # Khớp với bodyLimit của Fastify.
  client_max_body_size 50M;

  # proxy_buffering off là bắt buộc cho SSE: bật lên thì nginx gom cả stream rồi
  # mới trả một lượt, hỏng luôn cả yêu cầu độ trễ lẫn cơ chế ngắt stream giữa chừng.
  location /api/v1/chat {
    proxy_pass         http://api;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 300s;
    proxy_set_header   Connection '';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header         X-Accel-Buffering no;
  }

  location /api/ {
    proxy_pass         http://api;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass       http://api;
    access_log       off;
  }

  # WebSocket chỉ dùng cho thông báo escalation. Chat đi bằng SSE ở trên.
  location /ws/ {
    proxy_pass         http://api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass         http://console;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
  }
}
