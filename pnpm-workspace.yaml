packages:
  - apps/*
  - packages/*

# pnpm chặn build script của dependency theo mặc định. Hai gói dưới đây cần chạy
# postinstall để tải binary gốc, không bật thì tooling hỏng:
#   esbuild — tsx (dev api) và vite (build widget) dựa vào
#   sharp   — Next.js dùng để tối ưu ảnh
allowBuilds:
  esbuild: true
  sharp: true
